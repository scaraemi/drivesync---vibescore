# Keeps this fork up to date with VibeScore (m1omg/vibescore) and with the official MuseScore patch releases of
# the same version, and, when something changed, starts a
# Drive release (Android APK + Windows installer). The Drive changes stay on top as a merge.
# A merge conflict stops here: it is reported in the run, and the branch is left as it was.
name: 'Drive: sync with VibeScore'

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays, 03:17 UTC
  workflow_dispatch:
    inputs:
      release:
        description: 'Build and publish a release even without upstream changes'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: vibescore
          fetch-depth: 0

      - name: Merge VibeScore
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/m1omg/vibescore.git
          git fetch --no-tags upstream vibescore

          CHANGED=false
          NEW=$(git rev-list --count HEAD..upstream/vibescore)
          echo "VibeScore commits not here yet: $NEW"
          if [ "$NEW" != "0" ]; then
            if ! git merge --no-edit upstream/vibescore; then
              git merge --abort
              echo "::error::Merge conflict with VibeScore: merge upstream/vibescore by hand (the Drive files are src/drive, the Scores page and the build workflows)."
              exit 1
            fi
            CHANGED=true
          fi

          # The official MuseScore fixes of the same version (4.7.x patch releases), if VibeScore has not got them yet.
          # A conflict there is reported and skipped: VibeScore usually brings them in itself.
          SERIES=$(grep -oP 'MUSE_APP_VERSION_(MAJOR|MINOR) "\K[0-9]+' version.cmake | paste -sd.)
          TAG=$(git ls-remote --tags --refs https://github.com/musescore/MuseScore.git "v${SERIES}.*" \
                | awk '{ print $2 }' | sed 's|refs/tags/||' | sort -V | tail -1)
          echo "Newest official MuseScore ${SERIES}: ${TAG:-none}"
          if [ -n "$TAG" ]; then
            git fetch --no-tags https://github.com/musescore/MuseScore.git "refs/tags/$TAG:refs/upstream-musescore/$TAG"
            if git merge-base --is-ancestor "refs/upstream-musescore/$TAG" HEAD; then
              echo "MuseScore $TAG is already in"
            elif git merge --no-edit -m "Merge MuseScore $TAG" "refs/upstream-musescore/$TAG"; then
              # MuseScore's own CI is not used here, and the workflow token may not change workflows: keep ours
              if ! git diff --quiet HEAD^1 HEAD -- .github; then
                git restore --source=HEAD^1 --staged --worktree -- .github
                git commit --amend --no-edit
              fi
              echo "Merged MuseScore $TAG"
              CHANGED=true
            else
              git merge --abort
              echo "::warning::MuseScore $TAG does not merge cleanly with VibeScore: skipped (it needs a merge by hand)."
            fi
          fi

          if [ "$CHANGED" = "false" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git push origin HEAD:vibescore; then
            # The workflow token cannot change files under .github/workflows
            echo "::error::Push refused: VibeScore changed its workflows. Use 'Sync fork' on the repository page, then run 'Drive: release'."
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the workflow token starts no other workflow; a dispatch does
      - name: Start the release
        if: steps.merge.outputs.changed == 'true' || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run drive_release.yml --ref vibescore
