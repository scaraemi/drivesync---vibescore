name: 'Scoreconvert: Drive'

# Converts what the apps put in the Drive folder "Da convertire" (PDF, photos, recordings...) into .mscz
# scores in the synced folder. GitHub runs schedules only on the default branch, every 10 minutes at best
# and often a few minutes late; "Run workflow" converts right away.
#
# Secrets: VS_DRIVE_CLIENT_ID, VS_DRIVE_CLIENT_SECRET, VS_DRIVE_FOLDER_ID (the apps' own) and
# SCORECONVERT_REFRESH_TOKEN (a Google sign-in for the Drive account, see services/scoreconvert/README.md).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: scoreconvert-drive
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.VS_DRIVE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.VS_DRIVE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.SCORECONVERT_REFRESH_TOKEN }}
      DRIVE_FOLDER_ID: ${{ secrets.VS_DRIVE_FOLDER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: services/scoreconvert

      # Cheap check on the bare runner: the conversion image (a few GB) is pulled only when there is work.
      - name: Anything to convert?
        id: check
        run: python3 services/scoreconvert/scoreconvert/drive_worker.py --check

      - name: Convert
        if: steps.check.outputs.pending != '0' && steps.check.outputs.pending != ''
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The worker code comes from this checkout, so changes to it do not need a new image.
          docker run --rm \
            -e GOOGLE_CLIENT_ID -e GOOGLE_CLIENT_SECRET -e GOOGLE_REFRESH_TOKEN -e DRIVE_FOLDER_ID -e ANTHROPIC_API_KEY \
            -v "$PWD/services/scoreconvert/scoreconvert:/app/scoreconvert:ro" \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/scoreconvert:latest \
            python -m scoreconvert.drive_worker
