# Builds VibeScore for Android and MuseScore Studio for Windows and macOS, all with the Drive tab, and publishes
# them as a GitHub release (tag drive-<date>-<commit>). Started by "Drive: sync with VibeScore" or by hand.
#
# Updates:
# - Android: Obtainium (or any app that follows GitHub releases) on this repository installs each new APK.
#   The APKs must all be signed with the same key: set ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASS,
#   otherwise every build has a throwaway key and the app must be uninstalled to update.
# - Windows: run the new .msi; with WIN_MSI_TESTING_MU4_GUID set (a fixed GUID) it replaces the previous one.
# - macOS: the .dmg (universal, ad-hoc signed without an Apple Developer ID: the first time, right-click > Open).
#   A platform that fails to build is left out of the release (see the run).
name: 'Drive: release'

on:
  workflow_dispatch:
  # Also started by pushing to the branch drive-release (from outside GitHub, where "Run workflow" is not at hand)
  push:
    branches:
      - drive-release

permissions:
  contents: write

concurrency:
  group: drive-release
  cancel-in-progress: false

jobs:
  android:
    uses: ./.github/workflows/build_android.yml
    with:
      abi: 'arm64'
    secrets: inherit

  windows:
    uses: ./.github/workflows/build_windows.yml
    with:
      platforms: 'windows_x64'
      build_mode: 'devel'
      msi: true
    secrets: inherit

  macos:
    uses: ./.github/workflows/build_macos.yml
    with:
      build_mode: 'devel'
      # GitHub is often short of Apple silicon machines; the app is universal either way
      runner: 'macos-15-intel'
    secrets: inherit

  release:
    needs: [android, windows, macos]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success' || needs.macos.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Download the apps
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="drive-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir release
          find artifacts -name '*.apk' -exec cp {} release/VibeScore-Drive-android-arm64.apk \;
          find artifacts -name '*-symbols.so.xz' -exec cp {} release/VibeScore-Drive-android-arm64-symbols.so.xz \;
          find artifacts -name '*.msi' -exec cp {} release/MuseScore-Drive-windows-x64.msi \;
          find artifacts -name 'Drive-symbols-windows-x64.7z' -exec cp {} release/ \;
          find artifacts -name 'MuseScore-*.dmg' -exec cp {} release/MuseScore-Drive-macos.dmg \;
          if [ ! -f release/MuseScore-Drive-windows-x64.msi ]; then
            # No installer: the archive (unpack it and start bin\MuseScore4.exe)
            find artifacts -name 'MuseScore-*.7z' -exec cp {} release/MuseScore-Drive-windows-x64.7z \;
          fi
          ls -la release
          if [ -z "$(ls release)" ]; then
            echo "::error::No APK or MSI in the build artifacts"
            exit 1
          fi
          (cd release && sha256sum -- * > SHA256SUMS.txt)

          cat > notes.md <<EOF
          VibeScore (Android) and MuseScore Studio (Windows, macOS) with the Google Drive tab.

          macOS: open the .dmg and drag the app to Applications. It is not signed with an Apple Developer ID:
          the first time, right-click the app > Open (or System Settings > Privacy & Security > Open Anyway).

          Commit: ${GITHUB_SHA}
          EOF
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Drive $(date -u +%Y-%m-%d)" --notes-file notes.md
